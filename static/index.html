<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breast Cancer Prediction AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 800px; width: 100%; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 10px; }
        p { text-align: center; color: #7f8c8d; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: monospace; resize: vertical; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 15px; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        #result-box { margin-top: 20px; padding: 20px; border-radius: 5px; display: none; text-align: center; font-size: 18px; }
        .malignant { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .benign { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .error { background-color: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
    </style>
</head>
<body>

<div class="container">
    <h1>🩺 Breast Cancer Prediction AI</h1>
    <p>Paste the 30 medical features as a comma-separated list below.</p>
    
    <!-- We pre-fill the textarea with the sample data so it's easy to test -->
    <textarea id="features-input">17.99, 10.38, 122.8, 1001.0, 0.1184, 0.2776, 0.3001, 0.1471, 0.2419, 0.07871, 1.095, 0.9053, 8.589, 153.4, 0.006399, 0.04904, 0.05373, 0.01587, 0.03003, 0.006193, 25.38, 17.33, 184.6, 2019.0, 0.1622, 0.6656, 0.7119, 0.2654, 0.4601, 0.1189</textarea>
    
    <button onclick="predict()">Run Prediction</button>

    <div id="result-box"></div>
</div>

<script>
    async function predict() {
        const inputText = document.getElementById('features-input').value;
        const resultBox = document.getElementById('result-box');
        
        // Convert the comma-separated string into an array of numbers
        const featuresArray = inputText.split(',').map(num => parseFloat(num.trim()));
        
        if (featuresArray.length !== 30) {
            resultBox.style.display = 'block';
            resultBox.className = 'error';
            resultBox.innerHTML = `❌ Error: You provided ${featuresArray.length} features, but the model needs exactly 30.`;
            return;
        }

        resultBox.style.display = 'block';
        resultBox.className = '';
        resultBox.innerHTML = '⏳ Analyzing data...';

        try {
            // Send data to the API
            // Since the HTML is served by the same FastAPI app, we can use a relative URL!
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ features: featuresArray })
            });

            const data = await response.json();

            if (response.ok) {
                // Success
                const confidencePercent = (data.confidence * 100).toFixed(1);
                if (data.prediction === 'Malignant') {
                    resultBox.className = 'malignant';
                    resultBox.innerHTML = `<strong>Result: ${data.prediction}</strong><br>Confidence: ${confidencePercent}%`;
                } else {
                    resultBox.className = 'benign';
                    resultBox.innerHTML = `<strong>Result: ${data.prediction}</strong><br>Confidence: ${confidencePercent}%`;
                }
            } else {
                // Server error (like 400)
                resultBox.className = 'error';
                resultBox.innerHTML = `❌ API Error: ${data.detail}`;
            }
        } catch (error) {
            resultBox.className = 'error';
            resultBox.innerHTML = `❌ Network Error: Could not reach the API.`;
        }
    }
</script>

</body>
</html>
